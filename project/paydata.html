<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>認購單元付款明細查詢</title>
    <style>
        /* 採用 unit.html 的視覺設計風格 */
        :root {
            --primary-gold: #c5a368;
            --bg-dark: #1a1a1a;
            --card-bg: #2a2a2a;
            --text-light: #e0e0e0;
            --border-color: #3d3d3d;
        }

        body {
            font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-light);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            box-sizing: border-box;
        }

        /* 登錄容器與內容容器 */
        .container {
            background: var(--card-bg);
            width: 100%;
            max-width: 450px;
            padding: 40px 30px;
            border-radius: 2px;
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            position: relative;
        }

        .container::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 4px; height: 100%;
            background: var(--primary-gold);
        }

        h2 {
            color: var(--primary-gold);
            font-size: 1.5rem;
            margin-top: 0;
            margin-bottom: 30px;
            letter-spacing: 2px;
            text-align: center;
            font-weight: 400;
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.85rem;
            color: #888;
            letter-spacing: 1px;
        }

        input {
            width: 100%;
            background: #111;
            border: 1px solid var(--border-color);
            padding: 12px 15px;
            color: #fff;
            font-size: 1rem;
            border-radius: 0;
            box-sizing: border-box;
            transition: border-color 0.3s;
        }

        input:focus {
            border-color: var(--primary-gold);
            outline: none;
        }

        button {
            width: 100%;
            background: var(--primary-gold);
            color: #000;
            border: none;
            padding: 15px;
            font-size: 1rem;
            cursor: pointer;
            letter-spacing: 2px;
            font-weight: bold;
            transition: opacity 0.3s;
            margin-top: 10px;
        }

        button:hover {
            opacity: 0.9;
        }

        /* 查詢結果樣式 */
        .result-item {
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
        }

        .result-label {
            color: var(--primary-gold);
            font-size: 0.8rem;
            margin-bottom: 5px;
        }

        .result-value {
            font-size: 1.1rem;
            font-weight: 300;
        }

        .payment-section {
            background: #1f1f1f;
            padding: 20px;
            margin-top: 25px;
            border: 1px solid var(--border-color);
        }

        .payment-title {
            color: var(--primary-gold);
            font-size: 0.9rem;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
        }

        .payment-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 0.9rem;
            color: #bbb;
        }

        .payment-total {
            border-top: 1px solid var(--border-color);
            padding-top: 10px;
            margin-top: 10px;
            color: #fff;
            font-weight: bold;
        }

        .error {
            color: #ff4d4d;
            font-size: 0.85rem;
            margin-top: 15px;
            text-align: center;
        }

        #main-content { display: none; }

        /* 手機端優化 */
        @media (max-width: 480px) {
            .container {
                padding: 30px 20px;
                border: none;
                box-shadow: none;
                background: transparent;
            }
            body { background-color: var(--bg-dark); align-items: flex-start; }
        }
    </style>
</head>
<body>

<div id="login-container" class="container">
    <h2>DATA ACCESS</h2>
    <div class="form-group">
        <label>UNIT NUMBER / 單元編號</label>
        <input type="text" id="unitInput" placeholder="ENTER UNIT NO.">
    </div>
    <div class="form-group">
        <label>ACCESS CODE / 授權碼</label>
        <input type="password" id="authInput" placeholder="6-DIGIT CODE">
    </div>
    <button onclick="checkLogin()">VERIFY & LOGIN</button>
    <div id="loginError" class="error"></div>
</div>

<div id="main-content" class="container">
    <div id="display-area"></div>
    <button style="background: transparent; color: #666; border: 1px solid #444; margin-top: 30px;" onclick="location.reload()">BACK TO LOGIN</button>
</div>

<script>
// ===============================
// Data API 資料庫
// ===============================
const purchaseUnits = [
    { unitNo: "C1", area: 214.22, landNos: ["487-7"], mainPricePerPing: 6.79, mainTotal: 1455.02, subPricePerPing: 2.24, subTotal: 479.86, totalPrice: 1934.88 },
    { unitNo: "C1-1", area: 169.62, landNos: ["487-8"], mainPricePerPing: 6.79, mainTotal: 1152.08, subPricePerPing: 2.64, subTotal: 447.80, totalPrice: 1599.88 },
    { unitNo: "C2", area: 289.65, landNos: ["487-20", "487-21"], mainPricePerPing: 6.79, mainTotal: 1967.31, subPricePerPing: 2.24, subTotal: 648.81, totalPrice: 2616.12 },
    { unitNo: "C2-1", area: 245.70, landNos: ["487-2101", "487-22"], mainPricePerPing: 6.79, mainTotal: 1668.80, subPricePerPing: 2.24, subTotal: 550.36, totalPrice: 2219.16 },
    { unitNo: "C3", area: 329.89, landNos: ["487-23", "487-24"], mainPricePerPing: 6.79, mainTotal: 2240.63, subPricePerPing: 2.24, subTotal: 738.95, totalPrice: 2979.58 },
    { unitNo: "C5", area: 263.14, landNos: ["487-25", "487-26"], mainPricePerPing: 6.79, mainTotal: 1787.29, subPricePerPing: 2.24, subTotal: 589.44, totalPrice: 2376.73 },
    { unitNo: "C6", area: 406.10, landNos: ["487-27", "487-28", "487-29"], mainPricePerPing: 6.79, mainTotal: 2677.05, subPricePerPing: 2.24, subTotal: 909.67, totalPrice: 3586.72 },
    { unitNo: "C7", area: 250.08, landNos: ["487-30", "487-31"], mainPricePerPing: 6.59, mainTotal: 1648.57, subPricePerPing: 2.24, subTotal: 560.19, totalPrice: 2208.76 },
    { unitNo: "C8", area: 329.72, landNos: ["487-32", "487-33"], mainPricePerPing: 6.59, mainTotal: 2173.52, subPricePerPing: 2.24, subTotal: 738.57, totalPrice: 2912.09 },
    { unitNo: "C9", area: 329.85, landNos: ["487-34", "487-35"], mainPricePerPing: 6.59, mainTotal: 2174.41, subPricePerPing: 2.24, subTotal: 738.87, totalPrice: 2913.28 },
    { unitNo: "C10", area: 409.25, landNos: ["487-36", "487-37"], mainPricePerPing: 6.59, mainTotal: 2697.82, subPricePerPing: 2.24, subTotal: 916.73, totalPrice: 3614.55 }
];

// ===============================
// 登錄邏輯
// ===============================
function checkLogin() {
    const unitNo = document.getElementById("unitInput").value.trim().toUpperCase();
    const authCode = document.getElementById("authInput").value.trim();
    const errorDiv = document.getElementById("loginError");

    if (authCode !== "781945") {
        errorDiv.innerText = "INVALID ACCESS CODE / 授權碼錯誤";
        return;
    }

    const data = purchaseUnits.find(u => u.unitNo.toUpperCase() === unitNo);

    if (data) {
        renderResult(data);
    } else {
        errorDiv.innerText = "UNIT NOT FOUND / 查無此單元編號";
    }
}

// ===============================
// 渲染結果 (風格模仿 unit.html)
// ===============================
function renderResult(data) {
    const cfg = { m1: 0.3, m2: 0.3, m3: 0.4, s1: 1.0 };
    const p1_m = (data.mainTotal * cfg.m1).toFixed(2);
    const p1_s = (data.subTotal * cfg.s1).toFixed(2);
    const p1_t = (parseFloat(p1_m) + parseFloat(p1_s)).toFixed(2);
    const p2_m = (data.mainTotal * cfg.m2).toFixed(2);
    const p3_m = (data.mainTotal * cfg.m3).toFixed(2);

    document.getElementById("login-container").style.display = "none";
    document.getElementById("main-content").style.display = "block";

    document.getElementById("display-area").innerHTML = `
        <h2>PAYMENT DETAILS</h2>
        
        <div class="result-item">
            <div class="result-label">UNIT NO / 單元編號</div>
            <div class="result-value">${data.unitNo}</div>
        </div>

        <div class="result-item">
            <div class="result-label">LAND NOS / 土地地號</div>
            <div class="result-value">${data.landNos.join("、")}</div>
        </div>

        <div class="result-item">
            <div class="result-label">TOTAL PRICE / 認購總價款</div>
            <div class="result-value" style="color:var(--primary-gold)">NT$ ${data.totalPrice} 萬</div>
        </div>

        <div class="payment-section">
            <div class="payment-title"><span>PHASE 01</span> <span>簽約款</span></div>
            <div class="payment-row"><span>主約款 (30%)</span> <span>${p1_m} 萬</span></div>
            <div class="payment-row"><span>附約款 (100%)</span> <span>${p1_s} 萬</span></div>
            <div class="payment-row payment-total"><span>TOTAL</span> <span>${p1_t} 萬</span></div>
        </div>

        <div class="payment-section">
            <div class="payment-title"><span>PHASE 02</span> <span>備件款</span></div>
            <div class="payment-row"><span>主約款 (30%)</span> <span>${p2_m} 萬</span></div>
            <div class="payment-row payment-total"><span>TOTAL</span> <span>${p2_m} 萬</span></div>
        </div>

        <div class="payment-section">
            <div class="payment-title"><span>PHASE 03</span> <span>完稅款</span></div>
            <div class="payment-row"><span>主約款 (40%)</span> <span>${p3_m} 萬</span></div>
            <div class="payment-row payment-total"><span>TOTAL</span> <span>${p3_m} 萬</span></div>
        </div>
    `;
}
</script>

</body>
</html>
